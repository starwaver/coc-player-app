<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#151815">
  <title>陈嘉文 CoC 跑团记录</title>
  <link rel="manifest" href="manifest.json?v=9">
  <link rel="stylesheet" href="styles.css?v=9">
</head>
<body>
  <div class="app-shell">
    <header class="hero">
      <img class="hero-image" src="assets/chen-jiawen.png" alt="陈嘉文角色图">
      <div class="hero-scrim"></div>
      <div class="hero-content">
        <p class="kicker">Call of Cthulhu · 1998 松江</p>
        <div class="hero-title-row">
          <div>
            <h1 id="characterName">陈嘉文</h1>
            <p id="characterMeta">Kevin Chen · 24岁 · 摄影爱好者</p>
          </div>
          <button class="icon-button" id="resetButton" type="button" aria-label="恢复初始角色卡" title="恢复初始角色卡">↺</button>
        </div>
      </div>
    </header>

    <nav class="tab-bar" aria-label="主要页面">
      <button class="tab is-active" type="button" data-tab="dashboard">状态</button>
      <button class="tab" type="button" data-tab="skills">技能</button>
      <button class="tab" type="button" data-tab="clues">线索</button>
      <button class="tab" type="button" data-tab="log">日志</button>
      <button class="tab" type="button" data-tab="backup">备份</button>
    </nav>

    <main>
      <section class="tab-panel is-active" id="dashboard" aria-labelledby="状态">
        <section class="panel vitals-panel">
          <div class="section-heading">
            <h2>当前状态</h2>
            <button class="ghost-button" id="recalcButton" type="button">按规则重算上限</button>
          </div>
          <div class="vital-grid" id="vitalGrid"></div>
        </section>

        <section class="panel">
          <div class="section-heading">
            <h2>属性</h2>
            <span class="quiet">可直接修改</span>
          </div>
          <div class="segmented roll-mode dashboard-roll-mode" role="group" aria-label="属性奖励惩罚骰">
            <button class="is-active" type="button" data-roll-mode="0">普通</button>
            <button type="button" data-roll-mode="-1">奖励</button>
            <button type="button" data-roll-mode="1">惩罚</button>
          </div>
          <div class="attribute-grid" id="attributeGrid"></div>
        </section>

        <section class="panel">
          <div class="section-heading">
            <h2>派生速查</h2>
            <span class="quiet">可手动修正</span>
          </div>
          <div class="derived-grid" id="derivedGrid"></div>
        </section>

        <section class="panel">
          <div class="section-heading">
            <h2>状态标记</h2>
            <span class="quiet">跑团中快速勾选</span>
          </div>
          <div class="status-grid" id="statusGrid"></div>
          <label class="field full-field">
            <span>受伤 / 状态备注</span>
            <textarea id="statusNote" rows="3" placeholder="例如：右臂擦伤，临时疯狂持续至..."></textarea>
          </label>
        </section>

        <section class="panel dice-panel">
          <div class="section-heading">
            <h2>掷骰</h2>
            <span class="quiet" id="diceLast">尚未掷骰</span>
          </div>
          <div class="dice-controls">
            <button class="primary-button" type="button" data-roll="1d100">D100</button>
            <button type="button" data-roll="1d4">D4</button>
            <button type="button" data-roll="1d6">D6</button>
            <button type="button" data-roll="1d10">D10</button>
            <button type="button" data-roll="1d20">D20</button>
          </div>
          <label class="field">
            <span>自定义骰式</span>
            <div class="inline-field">
              <input id="customDice" type="text" value="1d100" inputmode="text">
              <button id="customRollButton" type="button">掷</button>
            </div>
          </label>
        </section>
      </section>

      <section class="tab-panel" id="skills" aria-labelledby="技能">
        <section class="panel sticky-tools">
          <div class="section-heading">
            <h2>技能检定</h2>
            <div class="section-actions">
              <button class="ghost-button delete-mode-button" type="button" data-delete-mode-toggle>删除模式：关</button>
              <button class="primary-button" id="addSkillButton" type="button">新增技能</button>
            </div>
          </div>
          <label class="field">
            <span>搜索技能</span>
            <input id="skillSearch" type="search" placeholder="摄影、聆听、中文...">
          </label>
          <div class="segmented roll-mode" role="group" aria-label="奖励惩罚骰">
            <button class="is-active" type="button" data-roll-mode="0">普通</button>
            <button type="button" data-roll-mode="-1">奖励</button>
            <button type="button" data-roll-mode="1">惩罚</button>
          </div>
          <div class="segmented" role="group" aria-label="技能分组">
            <button class="is-active" type="button" data-skill-filter="all">全部</button>
            <button type="button" data-skill-filter="主要技能">主要</button>
            <button type="button" data-skill-filter="其他技能">其他</button>
          </div>
        </section>
        <section class="skill-list" id="skillList"></section>
      </section>

      <section class="tab-panel" id="clues" aria-labelledby="线索">
        <section class="panel">
          <div class="section-heading">
            <h2>线索</h2>
            <div class="section-actions">
              <button class="ghost-button delete-mode-button" type="button" data-delete-mode-toggle>删除模式：关</button>
              <button class="primary-button" id="addClueButton" type="button">新增线索</button>
            </div>
          </div>
          <div class="card-list" id="clueList"></div>
        </section>

        <section class="panel">
          <div class="section-heading">
            <h2>物品</h2>
            <button class="primary-button" id="addItemButton" type="button">新增物品</button>
          </div>
          <div class="card-list" id="inventoryList"></div>
        </section>

        <section class="panel">
          <div class="section-heading">
            <h2>人物与背景</h2>
            <span class="quiet">速查</span>
          </div>
          <div class="lore-list" id="loreList"></div>
        </section>
      </section>

      <section class="tab-panel" id="log" aria-labelledby="日志">
        <section class="panel">
          <div class="section-heading">
            <h2>流程日志</h2>
            <div class="section-actions">
              <button class="ghost-button delete-mode-button" type="button" data-delete-mode-toggle>删除模式：关</button>
              <button class="primary-button" id="addLogButton" type="button">添加记录</button>
            </div>
          </div>
          <label class="field">
            <span>快速记录</span>
            <textarea id="quickLog" rows="3" placeholder="地点、NPC、伤害、SAN变化、下一步..."></textarea>
          </label>
          <div class="log-list" id="logList"></div>
        </section>
      </section>

      <section class="tab-panel" id="backup" aria-labelledby="备份">
        <section class="panel">
          <h2>本地保存与备份</h2>
          <p class="body-copy">所有改动会自动保存在当前浏览器。换手机、清缓存或跑团结束前，建议导出 JSON 备份。</p>
          <div class="backup-actions">
            <button class="primary-button" id="exportButton" type="button">导出备份 JSON</button>
            <label class="file-button">
              导入备份 JSON
              <input id="importInput" type="file" accept="application/json,.json">
            </label>
            <button class="danger-button" id="clearButton" type="button">清空本地记录</button>
          </div>
          <p class="quiet" id="saveStatus">尚未保存</p>
        </section>

        <section class="panel">
          <h2>角色简介</h2>
          <div class="profile-text" id="profileText"></div>
        </section>
      </section>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js?v=9"></script>
</body>
</html>
